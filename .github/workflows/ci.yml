name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck library
        run: npm run typecheck

      - name: Typecheck consumer API
        run: npm run typecheck:consumer

      - name: Build
        run: npm run build

      - name: Node smoke test
        run: npm run test:node

      - name: Verify package contents
        if: matrix.node == 24
        run: npm pack --dry-run

  bun:
    name: Bun 1.4.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --no-save

      - name: Typecheck library
        run: bun run typecheck

      - name: Typecheck consumer API
        run: bun run typecheck:consumer

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
